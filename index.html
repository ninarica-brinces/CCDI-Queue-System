<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCDI School Cashier Queue System</title>
  <style>
    body {
      align-items: center;
      background: #f1f5f9;
      color: #1e293b;
      display: flex;
      font-family: Arial, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
    }

    main {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.1);
      max-width: 640px;
      padding: 2.5rem;
      text-align: center;
      width: calc(100% - 3rem);
    }

    h1 {
      color: #1d4ed8;
      margin-top: 0;
    }

    .portals {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      margin-top: 2rem;
    }

    .portals a {
      background: #1d4ed8;
      border-radius: 6px;
      color: #fff;
      font-weight: 600;
      padding: 0.8rem 1.25rem;
      text-decoration: none;
    }

    .portals a:hover {
      background: #1e40af;
    }

    .portals a:last-child {
      background: #475569;
    }
  </style>
</head>
<body>
  <main>
    <h1>CCDI Cashier Recording Queue System</h1>
    <p>Choose a portal to continue.</p>
    <nav class="portals" aria-label="System portals">
      <a href="student.html">Student Portal</a>
      <a href="cashier.html">Cashier Portal</a>
    </nav>
  </main>
</body>
</html>
